[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "42_fly_in"
version = "1.0.0"
description = "3D Drone Routing Simulation and Visualization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "seoliver" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

# Explicitly tell Setuptools what to package to fix the flat-layout error
[tool.setuptools]
packages = ["agents", "elements"]
py-modules = ["server", "fly_in", "TrapLoopDetector"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
strict = true

[tool.flake8]
max-line-length = 79
exclude = [".git", "__pycache__", ".venv", "build", "dist"]