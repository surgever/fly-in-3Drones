<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly-in Telemetry</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #020408;
            --panel-bg: rgba(10, 16, 30, 0.85);
            --border-color: rgba(0, 255, 255, 0.2);
            --text-main: #a9b5c2;
            --text-highlight: #00ffff;
            --btn-bg: rgba(0, 255, 255, 0.1);
            --btn-hover: rgba(0, 255, 255, 0.3);
            --btn-disabled: rgba(255, 255, 255, 0.05);
        }
        body {
            margin: 0; overflow: hidden; background-color: var(--bg-color);
            font-family: 'SF Pro Display', sans-serif; color: var(--text-main);
            user-select: none;
        }
        canvas { display: block; }
        
        #welcome-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: var(--text-highlight);
            pointer-events: none; transition: opacity 0.5s ease;
        }
        #welcome-screen h1 { font-size: 6em; margin: 0; letter-spacing: 5px; text-transform: uppercase; }
        #welcome-screen p { font-size: 1.5em; margin-top: 5px; color: var(--text-main); }
        #tooltip {
            position: absolute;
            background: rgba(5, 9, 20, 0.95);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 12px;
            color: #fff;
            pointer-events: none;
            display: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transform: translate(-50%, -120%);
            z-index: 10;
        }
        .tooltip-title { color: var(--text-highlight); font-weight: bold; margin-bottom: 4px; }
        #speed-indicator {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 12px;
            color: var(--text-highlight);
            background: var(--panel-bg);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            opacity: 0;
            transition: opacity 0.3s;
        }
        #hud-container {
            position: absolute; top: 30px; right: 30px; background: var(--panel-bg);
            border: 1px solid var(--border-color); border-radius: 8px;
            padding: 20px; width: 380px; min-height: 250px;
            backdrop-filter: blur(10px); transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .hud-header-wrapper {
            display: flex; justify-content: space-between; align-items: center; }
        
        .hud-header {
            font-size: 14px; cursor: pointer; color: var(--text-highlight);
            display: flex; align-items: center; gap: 8px; margin: 0;
            font-weight: 600; text-transform: uppercase;
            overflow: hidden; word-wrap: none; transition: .3s ease-out;
            width: 100%; border-radius: 3px; margin-right: 5px; padding: 2px;
            -webkit-user-select: none; user-select: none;
        }
        .hud-header:hover {
            background: var(--btn-hover);
        }
        .chevron { font-size: 80%; transition: transform 0.3s ease; transform: rotate(90deg); }
        
        .btn-minimize {
            background: transparent; border: 1px solid var(--border-color);
            color: var(--text-highlight); border-radius: 4px; padding: 2px 8px;
            cursor: pointer; font-size: 16px; transition: 0.2s;
        }
        .btn-minimize:hover { background: var(--btn-bg); }

        .hud-content { transition: opacity 0.3s; margin-top: 20px; }
        #hud-container.minimized {
            min-height: 0px; border-radius: 0;
            height: auto; width: auto; overflow: hidden;
            padding: 0; border: 0 none; background: none;
        }
        #hud-container.minimized .hud-content {
            display: none;
            opacity: 0; pointer-events: none; margin: 0 }
        #hud-container.minimized .hud-header {display: none}

        #hud-container.selecting #map-dropdown { display: block; }
        #hud-container.selecting #simulation-stats { display: none !important; }
        #hud-container.selecting .chevron { transform: rotate(0deg); }

        #map-dropdown {
            display: none; background: rgba(5, 9, 20, 0.95); margin-top: 15px;
            border: 1px solid var(--border-color); border-radius: 4px; max-height: 250px;
            overflow-y: auto; padding: 5px 0;
        }
        
        .map-item {
            padding: 8px 15px; cursor: pointer; font-size: 13px;
        }
        .map-item:hover { background: rgba(0, 255, 255, 0.1); }
        .map-item.selected { color: #fff; background: rgba(0, 255, 255, 0.2); font-weight: bold; }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .stat-value { color: #fff; font-weight: 500; }
        
        .controls { display: flex; gap: 10px; margin-top: 25px; }
        .controls button {
            flex: 1; background: var(--btn-bg); border: 1px solid var(--border-color);
            color: var(--text-highlight); padding: 12px 0; border-radius: 4px; cursor: pointer;
            transition: ease-out .3s;
        }
        .controls button:hover:not(:disabled) {
            background: var(--btn-hover);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .controls button:disabled {
            background: var(--btn-disabled);
            color: rgba(255, 255, 255, 0.2);
            border-color: transparent;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="welcome-screen">
        <h1>fly-in</h1>
        <p>by seoliver</p>
    </div>

    <div id="tooltip"></div>
    <div id="speed-indicator">1.0x Speed</div>

    <div id="hud-container" class="selecting">
        <div class="hud-header-wrapper">
            <h2 class="hud-header" id="btn-toggle-maps">
                <span class="chevron" id="map-chevron">❯</span>
                <span id="map-title">Choose a map</span>
            </h2>
            <button class="btn-minimize" id="btn-min-toggle">-</button>
        </div>
        
        <div class="hud-content">
            <div id="map-dropdown" class="open"></div>
            
            <div id="simulation-stats">
                <div class="stat-row">
                    <span>Drones Delivered</span>
                    <span class="stat-value" id="val-delivered">0 / 0</span>
                </div>
                <div class="stat-row">
                    <span>Simulation Turn</span>
                    <span class="stat-value" id="val-turn">0 / 0</span>
                </div>
                
                <div class="controls">
                    <button id="btn-back" title="Step Back">⏮</button>
                    <button id="btn-playpause" title="Play/Pause">▶</button>
                    <button id="btn-stop" title="Stop/Reset">⏹</button>
                    <button id="btn-forward" title="Step Forward">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
